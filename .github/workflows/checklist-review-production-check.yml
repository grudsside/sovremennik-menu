name: Checklist review production safety

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/checklist-review-production-check.yml'
      - '.github/workflows/production-checklist-review-release.yml'
      - 'tools/production-checklist-review-release.mjs'
      - 'tools/production-checklist-review-release-workflow-check.mjs'
      - 'supabase/migrations/20260724210000_checklist_review_tools_preview.sql'

permissions:
  contents: read

jobs:
  safety:
    name: Production target and migration safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check release scripts and fixed production target
        run: |
          node --check tools/production-checklist-review-release.mjs
          node --check tools/production-checklist-review-release-workflow-check.mjs
          node tools/production-checklist-review-release-workflow-check.mjs
