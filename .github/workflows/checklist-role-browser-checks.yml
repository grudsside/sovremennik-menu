name: Checklist role browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/checklist-role-*.js'
      - 'assets/css/checklist-role-workflow.css'
      - 'tools/checklist-role-browser-smoke.mjs'
      - '.github/workflows/checklist-role-browser-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checklist-role-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Check waiter tabs and work for today
        run: node tools/checklist-role-browser-smoke.mjs
      - name: Upload preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-role-browser-preview
          path: artifacts/open-test-preview/role-today-and-waiter-checklists.png
          if-no-files-found: warn
          retention-days: 14
