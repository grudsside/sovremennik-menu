name: Attestations preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/js/attestations-core.js'
      - 'assets/js/attestations-ready-bank.js'
      - 'assets/js/attestations-preview.js'
      - 'assets/js/attestations-question-management-core.js'
      - 'assets/js/attestations-question-management.js'
      - 'assets/js/attestations-question-management-guard.js'
      - 'assets/js/attestations-question-management-buttons.js'
      - 'assets/css/attestations-preview.css'
      - 'assets/css/attestations-question-management.css'
      - 'assets/js/push.js'
      - 'service-worker.js'
      - 'supabase/migrations/20260728130000_attestations_preview.sql'
      - 'supabase/migrations/20260728223000_attestation_question_management.sql'
      - 'supabase/migrations/20260728231500_attestation_question_management_schema_reload.sql'
      - 'tools/attestations-preview-check.mjs'
      - 'tools/attestations-ready-bank-check.mjs'
      - 'tools/attestations-question-management-check.mjs'
      - 'tools/attestations-preview-db-smoke.sql'
      - 'tools/attestations-question-management-db-smoke.sql'
      - '.github/workflows/attestations-preview.yml'

permissions:
  contents: read

concurrency:
  group: attestations-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend structure, ready bank and question management
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts, sources, bank and management
        run: |
          node --check assets/js/attestations-core.js
          node --check assets/js/attestations-ready-bank.js
          node --check assets/js/attestations-preview.js
          node --check assets/js/attestations-question-management-core.js
          node --check assets/js/attestations-question-management.js
          node --check assets/js/attestations-question-management-guard.js
          node --check assets/js/attestations-question-management-buttons.js
          node --check tools/attestations-preview-check.mjs
          node --check tools/attestations-ready-bank-check.mjs
          node --check tools/attestations-question-management-check.mjs
          node tools/attestations-preview-check.mjs
          node tools/attestations-ready-bank-check.mjs
          node tools/attestations-question-management-check.mjs
          grep -q 'attestations-core.js?v=20260728-direct-2' index.html
          grep -q 'attestations-preview.js?v=20260728-direct-2' index.html
          grep -q 'attestations-preview.css?v=20260728-direct-2' index.html
          grep -q 'attestations-ready-bank.js?v=20260728-ready-1' assets/js/push.js
          grep -q 'attestations-question-management-core.js?v=20260728-1' assets/js/push.js
          grep -q 'attestations-question-management.js?v=20260728-1' assets/js/push.js
          grep -q 'attestations-question-management-guard.js?v=20260728-1' assets/js/push.js
          grep -q 'attestations-question-management-buttons.js?v=20260728-1' assets/js/push.js
          grep -q 'attestations-question-management.css?v=20260728-1' assets/js/push.js
          grep -q 'attestations-question-management-core.js' service-worker.js
          grep -q 'attestations-question-management.js' service-worker.js
          grep -q 'attestations-question-management-guard.js' service-worker.js
          grep -q 'attestations-question-management-buttons.js' service-worker.js
          grep -q 'attestations-question-management.css' service-worker.js
          grep -q "notify pgrst, 'reload schema'" supabase/migrations/20260728231500_attestation_question_management_schema_reload.sql

  database:
    name: Isolated roles, scoring and question management
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: preview
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply schema and test attestation roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d preview -f tools/free-preview-db-smoke.sql
          psql -h 127.0.0.1 -U postgres -d preview -f supabase/migrations/20260728130000_attestations_preview.sql
          psql -h 127.0.0.1 -U postgres -d preview -f supabase/migrations/20260728223000_attestation_question_management.sql
          psql -h 127.0.0.1 -U postgres -d preview -f supabase/migrations/20260728231500_attestation_question_management_schema_reload.sql
          psql -h 127.0.0.1 -U postgres -d preview -f tools/attestations-preview-db-smoke.sql
          psql -h 127.0.0.1 -U postgres -d preview -f tools/attestations-question-management-db-smoke.sql