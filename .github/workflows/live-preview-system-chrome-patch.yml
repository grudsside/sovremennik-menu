name: Live preview system Chrome patch

on:
  push:
    branches:
      - feature/attestations-preview-20260728

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attestations-preview-20260728
          fetch-depth: 0
      - name: Remove redundant Chromium installation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/live-preview.yml')
          text = path.read_text(encoding='utf-8')
          block = """      - name: Install Chromium for Attestations browser smoke
        run: npx playwright install --with-deps chromium

"""
          if block not in text:
              raise SystemExit('Chromium installation block not found')
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
          PY
      - name: Commit workflow optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/live-preview.yml
          git commit -m "Использовать системный Chrome в живом превью"
          git push origin HEAD:feature/attestations-preview-20260728
