name: Production checklist review release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-checklist-review-release.yml'
      - 'tools/production-checklist-review-release.mjs'
      - 'supabase/migrations/20260724210000_checklist_review_tools_preview.sql'
      - 'assets/js/checklist-review-tools.js'
      - 'assets/js/checklist-photo-draft-fix.js'
      - 'assets/js/control-section-stability-v2.js'
      - 'assets/js/control-section-draft-key-bridge.js'
      - 'assets/js/checklist-review-observer-guard.js'
      - 'assets/css/checklist-review-tools.css'
      - 'assets/js/push.js'
      - 'service-worker.js'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: production-checklist-review-release
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy and verify checklist review tools
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_PROJECT_REF: tjibbzfdughhjenumzxo
      PRODUCTION_SUPABASE_URL: https://tjibbzfdughhjenumzxo.supabase.co
      PRODUCTION_PAGES_URL: https://grudsside.github.io/sovremennik-menu

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo 'SUPABASE_ACCESS_TOKEN is missing.' >&2; exit 1; }
          [[ "$PRODUCTION_PROJECT_REF" == 'tjibbzfdughhjenumzxo' ]] || { echo 'Unexpected production Project Ref.' >&2; exit 1; }
          [[ "$PRODUCTION_SUPABASE_URL" == "https://${PRODUCTION_PROJECT_REF}.supabase.co" ]] || { echo 'Production URL and Project Ref do not match.' >&2; exit 1; }
          [[ "$PRODUCTION_PAGES_URL" == 'https://grudsside.github.io/sovremennik-menu' ]] || { echo 'Unexpected GitHub Pages URL.' >&2; exit 1; }

      - name: Apply and verify checklist review database migration
        run: node tools/production-checklist-review-release.mjs

      - name: Verify published GitHub Pages frontend
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "assets/js/push.js"
            "assets/js/checklist-review-observer-guard.js"
            "assets/js/checklist-review-tools.js"
            "assets/js/checklist-photo-draft-fix.js"
            "assets/js/control-section-stability-v2.js"
            "assets/js/control-section-draft-key-bridge.js"
            "assets/css/checklist-review-tools.css"
            "service-worker.js"
          )
          published=false
          mkdir -p /tmp/checklist-review-pages

          for attempt in {1..60}; do
            all_match=true
            for file in "${files[@]}"; do
              downloaded="/tmp/checklist-review-pages/${file//\//_}"
              if ! curl --fail --silent --show-error \
                "${PRODUCTION_PAGES_URL}/${file}?release=${GITHUB_SHA}&attempt=${attempt}" \
                --output "$downloaded"; then
                echo "Attempt ${attempt}: ${file} is not available on GitHub Pages."
                all_match=false
                continue
              fi

              if ! cmp -s "$file" "$downloaded"; then
                local_hash="$(sha256sum "$file" | cut -d' ' -f1)"
                published_hash="$(sha256sum "$downloaded" | cut -d' ' -f1)"
                echo "Attempt ${attempt}: ${file} does not match release source (local=${local_hash}, published=${published_hash})."
                all_match=false
              fi
            done

            if [[ "$all_match" == 'true' ]]; then
              published=true
              break
            fi
            sleep 10
          done

          [[ "$published" == 'true' ]] || { echo 'GitHub Pages did not publish the exact checklist review release assets in time.' >&2; exit 1; }

      - name: Publish release summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Checklist review tools released to production'
            echo
            echo '- Comment history table, RLS and protected RPC functions are active.'
            echo '- Manager/admin comments create employee tasks through the protected function.'
            echo '- Admin-only soft deletion and audit fields are active.'
            echo '- Soft-deleted submissions are excluded from ordinary application queries.'
            echo '- One Control coordinator protects native taps, coalesces redundant redraws, preserves the viewport and respects restored offline drafts.'
            echo '- Raw and photo-enhanced checklist keys remain compatible during offline restoration.'
            echo '- GitHub Pages serves files identical to the approved release source.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish machine-readable production status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STATUS" == 'success' ]]; then
            state='success'
            description='Checklist review production deployment passed'
          else
            state='failure'
            description='Checklist review production deployment failed'
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --raw-field state="$state" \
            --raw-field context='production/checklist-review' \
            --raw-field description="$description" \
            --raw-field target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish permanent release receipt
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STATUS" == 'success' ]]; then
            heading='✅ Checklist review production release verified'
            details='Database migration, RLS, protected comment/deletion RPC functions, unified Control stability, offline-draft key compatibility and exact GitHub Pages release assets passed.'
          else
            heading='❌ Checklist review production release requires attention'
            details='At least one production deployment or verification step failed. Review the workflow before using comments or deletion.'
          fi
          {
            printf '%s\n\n' "$heading"
            printf '%s\n\n' "$details"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Workflow: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- Production app: https://grudsside.github.io/sovremennik-menu/\n'
            printf -- '- Production Supabase Ref: `tjibbzfdughhjenumzxo`\n'
          } > /tmp/checklist-review-release-comment.md
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/62/comments" \
            --raw-field body="$(cat /tmp/checklist-review-release-comment.md)"

      - name: Upload production release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-checklist-review-release
          path: artifacts/production-checklist-review-release
          if-no-files-found: warn
          retention-days: 30
