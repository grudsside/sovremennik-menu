name: Attestations browser smoke patch

on:
  push:
    branches:
      - feature/attestations-preview-20260728

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attestations-preview-20260728
          fetch-depth: 0
      - name: Add real browser check to live preview
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/live-preview.yml')
          text = path.read_text(encoding='utf-8')
          old_install = """      - name: Install preview test dependencies
        run: npm install --no-save @supabase/supabase-js@2
"""
          new_install = """      - name: Install preview test dependencies
        run: npm install --no-save @supabase/supabase-js@2 playwright@1.54.1

      - name: Install Chromium for Attestations browser smoke
        run: npx playwright install --with-deps chromium
"""
          if new_install not in text:
              if old_install not in text:
                  raise SystemExit('Install block not found')
              text = text.replace(old_install, new_install, 1)

          old_smoke = """          node tools/live-preview-smoke.mjs 2> >(tee artifacts/live-preview/smoke-error.log >&2)
"""
          new_smoke = old_smoke + """          node tools/live-preview-attestations-browser-smoke.mjs 2> >(tee artifacts/live-preview/attestations-browser-smoke-error.log >&2)
"""
          if 'live-preview-attestations-browser-smoke.mjs' not in text:
              if old_smoke not in text:
                  raise SystemExit('Smoke block not found')
              text = text.replace(old_smoke, new_smoke, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit browser smoke integration
        run: |
          if git diff --quiet -- .github/workflows/live-preview.yml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/live-preview.yml
          git commit -m "Проверять вкладку аттестаций в живом превью"
          git push origin HEAD:feature/attestations-preview-20260728
