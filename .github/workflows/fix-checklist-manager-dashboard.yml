name: Fix checklist manager dashboard integration

on:
  push:
    branches:
      - feature/role-personalized-interface-20260724
    paths:
      - '.github/workflows/fix-checklist-manager-dashboard.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/fix-checklist-manager-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/role-personalized-interface-20260724' || github.ref == 'refs/heads/feature/role-personalized-interface-20260724'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/role-personalized-interface-20260724
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve manager and administrator dashboards
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'assets/js/checklist-role-workflow.js';
          let source = fs.readFileSync(file, 'utf8');
          const previous = `    let current=home.querySelector('[data-role-home-intro]');
              if(role==='manager'){
                current?.remove();
                return;
              }
              if(!['barista','waiter'].includes(role)) return;`;
          const replacement = `    let current=home.querySelector('[data-role-home-intro]');
              if(!['barista','waiter'].includes(role)){
                if(current?.matches?.('[data-role-today-work]')) current.remove();
                return;
              }`;
          if (source.includes(previous)) source = source.replace(previous, replacement);
          else if (!source.includes(replacement)) throw new Error('Expected checklist dashboard integration block was not found.');
          fs.writeFileSync(file, source);
          NODE
          node --check assets/js/checklist-role-workflow.js
          rm -f .github/workflows/fix-checklist-manager-dashboard.yml
      - name: Commit integration fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve manager dashboard in checklist workflow'
          git push origin HEAD:feature/role-personalized-interface-20260724
