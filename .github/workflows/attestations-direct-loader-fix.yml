name: Attestations direct loader fix

on:
  push:
    branches:
      - feature/attestations-preview-20260728

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attestations-preview-20260728
          fetch-depth: 0
      - name: Load attestations directly from index
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          css = '  <link rel="stylesheet" href="assets/css/attestations-preview.css?v=20260728-direct-2">'
          if css not in text:
              marker = '  <link rel="stylesheet" href="assets/css/styles.css">'
              if marker not in text:
                  raise SystemExit('styles marker not found')
              text = text.replace(marker, marker + '\n' + css, 1)

          core = '  <script src="assets/js/attestations-core.js?v=20260728-direct-2"></script>'
          preview = '  <script src="assets/js/attestations-preview.js?v=20260728-direct-2"></script>'
          loader = '  <script src="assets/js/push.js?v=20260720-1&attestations=20260728-3"></script>'
          if core not in text or preview not in text:
              if loader not in text:
                  raise SystemExit('push loader marker not found')
              replacement = loader + '\n' + core + '\n' + preview
              text = text.replace(loader, replacement, 1)
          index.write_text(text, encoding='utf-8')

          push = Path('assets/js/push.js')
          push_text = push.read_text(encoding='utf-8')
          lines = [line for line in push_text.splitlines() if 'attestations-preview.css' not in line and 'attestations-core.js' not in line and 'attestations-preview.js' not in line]
          push.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit direct loader fix
        run: |
          if git diff --quiet -- index.html assets/js/push.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/push.js
          git commit -m "Подключить аттестации напрямую в превью"
          git push origin HEAD:feature/attestations-preview-20260728
