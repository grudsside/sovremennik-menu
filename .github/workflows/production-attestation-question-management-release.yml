name: Production attestation question management release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-attestation-question-management-release.yml'
      - 'tools/production-attestation-question-management-release.mjs'
      - 'supabase/migrations/20260728223000_attestation_question_management.sql'
      - 'assets/js/attestations-question-management-core.js'
      - 'assets/js/attestations-question-management.js'
      - 'assets/js/attestations-question-management-guard.js'
      - 'assets/js/attestations-question-management-buttons.js'
      - 'assets/css/attestations-question-management.css'
      - 'assets/js/push.js'
      - 'service-worker.js'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-attestation-question-management-release
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy and verify question management
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_PROJECT_REF: tjibbzfdughhjenumzxo
      PRODUCTION_SUPABASE_URL: https://tjibbzfdughhjenumzxo.supabase.co
      PRODUCTION_PAGES_URL: https://grudsside.github.io/sovremennik-menu

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo 'SUPABASE_ACCESS_TOKEN is missing.' >&2; exit 1; }
          [[ "$PRODUCTION_PROJECT_REF" == 'tjibbzfdughhjenumzxo' ]] || { echo 'Unexpected production Project Ref.' >&2; exit 1; }
          [[ "$PRODUCTION_SUPABASE_URL" == "https://${PRODUCTION_PROJECT_REF}.supabase.co" ]] || { echo 'Production URL and Project Ref do not match.' >&2; exit 1; }
          [[ "$PRODUCTION_PAGES_URL" == 'https://grudsside.github.io/sovremennik-menu' ]] || { echo 'Unexpected GitHub Pages URL.' >&2; exit 1; }

      - name: Apply and verify question management migration
        run: node tools/production-attestation-question-management-release.mjs

      - name: Verify published GitHub Pages frontend
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "assets/js/push.js"
            "assets/js/attestations-question-management-core.js"
            "assets/js/attestations-question-management.js"
            "assets/js/attestations-question-management-guard.js"
            "assets/js/attestations-question-management-buttons.js"
            "assets/css/attestations-question-management.css"
            "service-worker.js"
          )
          published=false
          mkdir -p /tmp/attestation-question-management-pages

          for attempt in {1..60}; do
            all_match=true
            for file in "${files[@]}"; do
              downloaded="/tmp/attestation-question-management-pages/${file//\//_}"
              if ! curl --fail --silent --show-error \
                "${PRODUCTION_PAGES_URL}/${file}?release=${GITHUB_SHA}&attempt=${attempt}" \
                --output "$downloaded"; then
                echo "Attempt ${attempt}: ${file} is not available on GitHub Pages."
                all_match=false
                continue
              fi
              if ! cmp -s "$file" "$downloaded"; then
                local_hash="$(sha256sum "$file" | cut -d' ' -f1)"
                published_hash="$(sha256sum "$downloaded" | cut -d' ' -f1)"
                echo "Attempt ${attempt}: ${file} does not match release source (local=${local_hash}, published=${published_hash})."
                all_match=false
              fi
            done
            if [[ "$all_match" == 'true' ]]; then
              published=true
              break
            fi
            sleep 10
          done

          [[ "$published" == 'true' ]] || { echo 'GitHub Pages did not publish the exact question management assets in time.' >&2; exit 1; }

      - name: Publish release summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Attestation question management released to production'
            echo
            echo '- Administrators can edit automatic and manual questions.'
            echo '- Administrators can soft-delete questions with an audit trail.'
            echo '- Deleted automatic questions remain suppressed instead of reappearing from the generated bank.'
            echo '- Question management initializes after administrator authorization and binds controls by the visible bank order.'
            echo '- Employees and managers do not receive question management controls.'
            echo '- GitHub Pages serves files identical to the approved release source.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish machine-readable production status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STATUS" == 'success' ]]; then
            state='success'
            description='Attestation question management deployment passed'
          else
            state='failure'
            description='Attestation question management deployment failed'
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --raw-field state="$state" \
            --raw-field context='production/attestation-question-management' \
            --raw-field description="$description" \
            --raw-field target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload production release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-attestation-question-management-release
          path: artifacts/production-attestation-question-management-release
          if-no-files-found: warn
          retention-days: 30