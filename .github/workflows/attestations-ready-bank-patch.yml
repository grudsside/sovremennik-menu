name: Attestations ready bank patch

on:
  push:
    branches:
      - feature/attestations-preview-20260728

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attestations-preview-20260728
          fetch-depth: 0
      - name: Connect ready question bank
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          core = '  <script src="assets/js/attestations-core.js?v=20260728-direct-2"></script>'
          ready = '  <script src="assets/js/attestations-ready-bank.js?v=20260728-ready-1"></script>'
          if ready not in text:
              if core not in text:
                  raise SystemExit('Attestations core marker not found in index.html')
              text = text.replace(core, core + '\n' + ready, 1)
          index.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_assets = "'./assets/js/attestations-core.js','./assets/js/attestations-preview.js'"
          new_assets = "'./assets/js/attestations-core.js','./assets/js/attestations-ready-bank.js','./assets/js/attestations-preview.js'"
          if 'attestations-ready-bank.js' not in sw_text:
              if old_assets not in sw_text:
                  raise SystemExit('Attestations assets marker not found in service-worker.js')
              sw_text = sw_text.replace(old_assets, new_assets, 1)
          sw_text = sw_text.replace("sovremennik-offline-20260728-v20", "sovremennik-offline-20260728-v21")
          sw_text = sw_text.replace("sovremennik-runtime-20260728-v20", "sovremennik-runtime-20260728-v21")
          sw.write_text(sw_text, encoding='utf-8')

          workflow = Path('.github/workflows/attestations-preview.yml')
          wf = workflow.read_text(encoding='utf-8')
          path_marker = "      - 'assets/js/attestations-core.js'"
          ready_path = "      - 'assets/js/attestations-ready-bank.js'"
          if ready_path not in wf:
              wf = wf.replace(path_marker, path_marker + '\n' + ready_path, 1)
          tool_marker = "      - 'tools/attestations-preview-check.mjs'"
          ready_tool = "      - 'tools/attestations-ready-bank-check.mjs'"
          if ready_tool not in wf:
              wf = wf.replace(tool_marker, tool_marker + '\n' + ready_tool, 1)
          check_marker = "          node --check assets/js/attestations-core.js"
          ready_checks = "          node --check assets/js/attestations-ready-bank.js\n          node --check tools/attestations-ready-bank-check.mjs\n          node tools/attestations-ready-bank-check.mjs"
          if 'node tools/attestations-ready-bank-check.mjs' not in wf:
              wf = wf.replace(check_marker, check_marker + '\n' + ready_checks, 1)
          index_marker = "          grep -q 'attestations-core.js?v=20260728-direct-2' index.html"
          index_ready = "          grep -q 'attestations-ready-bank.js?v=20260728-ready-1' index.html"
          if index_ready not in wf:
              wf = wf.replace(index_marker, index_marker + '\n' + index_ready, 1)
          sw_marker = "          grep -q 'attestations-core.js' service-worker.js"
          sw_ready = "          grep -q 'attestations-ready-bank.js' service-worker.js"
          if sw_ready not in wf:
              wf = wf.replace(sw_marker, sw_marker + '\n' + sw_ready, 1)
          workflow.write_text(wf, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet -- index.html service-worker.js .github/workflows/attestations-preview.yml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js .github/workflows/attestations-preview.yml
          git commit -m "Подключить готовый банк по 20 вопросов"
          git push origin HEAD:feature/attestations-preview-20260728
