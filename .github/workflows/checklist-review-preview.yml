name: Control v4 preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'assets/js/control-v4-core.js'
      - 'assets/js/control-v4-storage.js'
      - 'assets/js/control-v4-service.js'
      - 'assets/js/control-v4-control.js'
      - 'assets/js/control-v4-checklists.js'
      - 'assets/js/control-v4.js'
      - 'assets/css/control-v4.css'
      - 'assets/js/push.js'
      - 'service-worker.js'
      - 'supabase/migrations/20260724210000_checklist_review_tools_preview.sql'
      - 'tools/control-v4-core-check.mjs'
      - 'tools/control-v4-mobile-browser-smoke.mjs'
      - 'tools/offline-reliability-browser-smoke.mjs'
      - 'tools/checklist-review-tools-check.mjs'
      - 'tools/checklist-preview-regression-check.mjs'
      - 'tools/checklist-review-tools-db-smoke.sql'
      - '.github/workflows/checklist-review-preview.yml'

permissions:
  contents: read

concurrency:
  group: control-v4-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Mobile architecture and browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check syntax and runtime isolation
        run: |
          node --check assets/js/control-v4-core.js
          node --check assets/js/control-v4-storage.js
          node --check assets/js/control-v4-service.js
          node --check assets/js/control-v4-control.js
          node --check assets/js/control-v4-checklists.js
          node --check assets/js/control-v4.js
          node --check assets/js/push.js
          node --check service-worker.js
          node --check tools/control-v4-core-check.mjs
          node --check tools/control-v4-mobile-browser-smoke.mjs
          node --check tools/offline-reliability-browser-smoke.mjs
          node tools/control-v4-core-check.mjs

      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium webkit

      - name: Test real mobile taps and one-shot submissions
        run: node tools/control-v4-mobile-browser-smoke.mjs

      - name: Test offline queue and reconnect duplicate protection
        run: node tools/offline-reliability-browser-smoke.mjs

  database:
    name: Isolated database smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: preview
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply schema and test protected review functions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d preview -f tools/free-preview-db-smoke.sql
          psql -h 127.0.0.1 -U postgres -d preview -f supabase/migrations/20260724210000_checklist_review_tools_preview.sql
          psql -h 127.0.0.1 -U postgres -d preview -f tools/checklist-review-tools-db-smoke.sql
