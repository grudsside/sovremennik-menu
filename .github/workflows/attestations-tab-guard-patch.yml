name: Attestations tab guard patch

on:
  push:
    branches:
      - feature/attestations-preview-20260728

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attestations-preview-20260728
          fetch-depth: 0
      - name: Connect Attestations tab guard
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          preview = '  <script src="assets/js/attestations-preview.js?v=20260728-direct-2"></script>'
          guard = '  <script src="assets/js/attestations-tab-guard.js?v=20260728-guard-1"></script>'
          if guard not in text:
              if preview not in text:
                  raise SystemExit('Attestations preview script marker not found in index.html')
              text = text.replace(preview, preview + '\n' + guard, 1)
          index.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          old = "'./assets/js/attestations-core.js','./assets/js/attestations-preview.js'"
          new = "'./assets/js/attestations-core.js','./assets/js/attestations-preview.js','./assets/js/attestations-tab-guard.js'"
          if 'attestations-tab-guard.js' not in sw_text:
              if old not in sw_text:
                  raise SystemExit('Attestations service-worker marker not found')
              sw_text = sw_text.replace(old, new, 1)
          sw.write_text(sw_text, encoding='utf-8')

          workflow = Path('.github/workflows/attestations-preview.yml')
          wf = workflow.read_text(encoding='utf-8')
          path_marker = "      - 'assets/js/attestations-preview.js'"
          guard_path = "      - 'assets/js/attestations-tab-guard.js'"
          if guard_path not in wf:
              wf = wf.replace(path_marker, path_marker + '\n' + guard_path, 1)
          check_marker = "          node --check assets/js/attestations-preview.js"
          guard_check = "          node --check assets/js/attestations-tab-guard.js"
          if guard_check not in wf:
              wf = wf.replace(check_marker, check_marker + '\n' + guard_check, 1)
          index_check = "          grep -q 'attestations-preview.js?v=20260728-direct-2' index.html"
          guard_index_check = "          grep -q 'attestations-tab-guard.js?v=20260728-guard-1' index.html"
          if guard_index_check not in wf:
              wf = wf.replace(index_check, index_check + '\n' + guard_index_check, 1)
          sw_check = "          grep -q 'attestations-preview.js' service-worker.js"
          guard_sw_check = "          grep -q 'attestations-tab-guard.js' service-worker.js"
          if guard_sw_check not in wf:
              wf = wf.replace(sw_check, sw_check + '\n' + guard_sw_check, 1)
          workflow.write_text(wf, encoding='utf-8')
          PY
      - name: Commit guard integration
        run: |
          if git diff --quiet -- index.html service-worker.js .github/workflows/attestations-preview.yml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js .github/workflows/attestations-preview.yml
          git commit -m "Подключить защиту вкладки аттестаций"
          git push origin HEAD:feature/attestations-preview-20260728
